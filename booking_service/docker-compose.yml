services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_HOST}
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network


volumes:
  postgres-data:

networks:
  booking-network: