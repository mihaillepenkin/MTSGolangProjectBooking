services:

  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    networks:
      - booking-network

  kafka:
    image: bitnamilegacy/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - booking-network

  notification-service:
    build: ./notification_service
    container_name: notification-service
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=booking-events
      - KAFKA_GROUP_ID=notification-group
      - NOTIFICATION_FROM_EMAIL=your_email@example.com
      - NOTIFICATION_EMAIL_PASSWORD=your_app_password
      - NOTIFICATION_SMTP_HOST=smtp.example.com
      - NOTIFICATION_SMTP_PORT=587
    depends_on:
      - kafka
    networks:
      - booking-network
    command: ["./app"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: auth
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    build: ./auth_service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=auth-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=123
      - DB_NAME=auth
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8081
    volumes:
      - ./auth_service/migrations:/app/migrations
    depends_on:
      - auth-postgres
    networks:
      - booking-network
    command: ["./app"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  booking-postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: booking
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  booking-service:
    build: ./booking_service
    container_name: booking-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./booking_service/config.yml:/app/config.yml
      - ./booking_service/migrations:/app/migrations
    depends_on:
      - booking-postgres
    networks:
      - booking-network
    command: ["./app"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  booking-prometheus:
    image: prom/prometheus:v3.8.0
    container_name: booking-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./booking_service/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - booking-network

  booking-grafana:
    image: grafana/grafana:12.3.0
    container_name: booking-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - booking-prometheus
    networks:
      - booking-network

  payment-service:
    build: ./payment_service
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ./payment_service/config.yml:/app/config.yml
    networks:
      - booking-network
    command: [ "./app" ]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  hotel-postgres:
      image: postgres:16-alpine
      container_name: hotel-postgres
      restart: unless-stopped
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: hotels_data
      volumes:
        - hotel-postgres-data:/var/lib/postgresql/data
      networks:
        - booking-network
      logging:
        driver: "local"
        options:
          max-size: "10m"
          max-file: "3"

  hotel-service:
    build: ./hotel_service
    container_name: hotel-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./hotel_service/config.yml:/app/config.yml
      - ./hotel_service/migrations:/app/migrations
    depends_on:
      - hotel-postgres
    networks:
      - booking-network
    command: ["./app"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  booking-postgres-data:
  hotel-postgres-data:
  auth-postgres-data:
  prometheus-data:
  grafana-data:
  kafka-data:
  zookeeper-data:

networks:
  booking-network:
