services:

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - booking-network
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  notification-service:
    build: ./notification_service
    container_name: notification-service
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=booking-events
      - KAFKA_GROUP_ID=notification-group
      - NOTIFICATION_FROM_EMAIL=your_email@example.com
      - NOTIFICATION_EMAIL_PASSWORD=your_app_password
      - NOTIFICATION_SMTP_HOST=smtp.example.com
      - NOTIFICATION_SMTP_PORT=587
    depends_on:
      - kafka
    networks:
      - booking-network
    command: ["./app"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    build: ./auth_service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=booking-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=123
      - DB_NAME=booking
      - JWT_SECRET=your_strong_jwt_secret_here
      - PORT=8081
    depends_on:
      - booking-postgres
    networks:
      - booking-network
    command: ["./app"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
  booking-postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: booking
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  booking-service:
    build: ./booking_service
    container_name: booking-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./booking_service/config.yml:/app/config.yml
      - ./booking_service/migrations:/app/migrations
    depends_on:
      - booking-postgres
    networks:
      - booking-network
    command: ["./app"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  booking-prometheus:
    image: prom/prometheus:v3.8.0
    container_name: booking-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./booking_service/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - booking-network


  booking-grafana:
    image: grafana/grafana:12.3.0
    container_name: booking-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - booking-prometheus
    networks:
      - booking-network

  payment-service:
    build: ./payment_service
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ./payment_service/config.yml:/app/config.yml
    networks:
      - booking-network
    command: [ "./app" ]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  booking-postgres-data:
  prometheus-data:
  grafana-data:
  kafka-data:

networks:
  booking-network:
