services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_NAME: hotels_data
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - booking-network


volumes:
  postgres-data:

networks:
  booking-network: