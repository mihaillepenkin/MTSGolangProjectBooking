name: build.yml

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: ["main"]

env:
  GO_VERSION: '1.24.0'
  BOOKING_DIR: 'booking_service'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.BOOKING_DIR }}
        run: |
          go mod tidy
          go mod download

      - name: Run tests
        working-directory: ${{ env.BOOKING_DIR }}
        run: |
          echo "Running tests..."
          go test -v -race ./...
